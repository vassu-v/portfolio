        <h1>Buy4Chai</h1>
        <p>Self-hosted supporter page for devs Stripe locked out of. · Early 2026</p>
        <p>Tags: Open Source, Razorpay / UPI, Vercel, MIT, JavaScript</p>
        <p><strong>16+ GitHub stars · 7 forks · MIT license</strong></p>

        <h2>The problem</h2>
        <p>Stripe doesn't operate for most Indian developers. Buy Me a Coffee and Ko-fi don't support UPI or Razorpay natively. The workarounds people used (QR code screenshots, manual bank transfers, awkward PayPal setups) broke the supporter experience entirely.</p>
        <p>A Reddit thread surfaced it clearly: 29 upvotes from developers who'd simply stopped trying to earn from their work. Not because the audience wasn't there, but because the infrastructure didn't exist.</p>

        <h2>What it does</h2>
        <p>Buy4Chai is a self-hosted supporter page you deploy to Vercel in under 10 minutes. Razorpay and UPI work natively, so supporters in India can pay without friction. No platform cut. You own the data, the experience, and the URL.</p>
        <p>The name is deliberately local. A cup of chai is what you actually get in Kolkata when someone wants to say thank you.</p>

        <h2>How it works</h2>
        <ul>
          <li><strong>Setup:</strong> Fork the repo, drop in your Razorpay key and UPI ID, push to Vercel. Ten minutes including reading the README.</li>
          <li><strong>Payments:</strong> Razorpay handles card + UPI + netbanking. Supporters pick what they want to send and check out without leaving your page.</li>
          <li><strong>Zero fees:</strong> No platform cut. Razorpay charges their standard processing fee (1.9%), and that's it. No one else takes a slice.</li>
          <li><strong>MIT licensed:</strong> Fork it, modify it, white-label it. Seven people already have.</li>
        </ul>

        <h2>Impact</h2>
