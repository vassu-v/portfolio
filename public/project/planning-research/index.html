      <article>
        <h1>Grounded Planning Research</h1>
        <p>Exposing brittle AI reasoning that high success rates hide. · Late 2025 – Jan 2026</p>
        <p>Tags: AI Research, Planning Systems, Python, Ablation Study, Zenodo</p>
        <p><strong>Published on Zenodo · Jan 9, 2026 · 3 GitHub stars</strong></p>

        <h2>The problem</h2>
        <p>AI planning benchmarks are saturating. Agents report 90%+ success rates on standard tasks. The assumption is that high success rates mean robust planning, but success rates measure outcomes, not the reasoning that produced them.</p>
        <p>An agent can get to the right answer through fundamentally brittle logic, and you won't know until it fails on a slightly different problem. The question I wanted to answer: is there a pressure point that makes the brittleness visible before it fails in deployment?</p>

        <h2>What it does</h2>
        <p>Object commitment is that pressure point. When you force an agent to explicitly name which objects it's operating on before selecting actions (rather than letting it discover them opportunistically) you expose something important: agents that were planning correctly stay correct, and agents that were guessing in the right direction fall apart.</p>
        <p>The study runs a controlled ablation in a deterministic filesystem environment. Action-only variant vs. object-centric variant. Same tasks, same success criteria. The failure modes in the object-centric variant are structured and repeatable. You can predict where they'll occur, which means you can actually debug the reasoning.</p>

        <h2>How it works</h2>
        <ul>
          <li><strong>Environment:</strong> Deterministic filesystem tasks: file operations, directory traversal, conditional logic. Clean ground truth, no ambiguity in success/failure.</li>
          <li><strong>Ablation design:</strong> Action-only: agent selects an action and a target is inferred. Object-centric: agent must commit to the specific object before selecting the action.</li>
          <li><strong>Failure analysis:</strong> Object-centric variant surfaces consistent failure patterns tied to specific object relationships. These patterns don't appear in aggregate success metrics.</li>
          <li><strong>Implication:</strong> High-level success rates are insufficient diagnostics. Object commitment as a forced step is a practical technique for surfacing latent planning failures before deployment.</li>
        </ul>
