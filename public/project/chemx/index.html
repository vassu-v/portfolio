      <article>
        <h1>ChemX</h1>
        <p>Physical chemistry simulator controlled from a browser. · Dec 2024 – Feb 2025</p>
        <p>Tags: Arduino, Electronics, C/C++, Web Interface, IoT</p>
        <p><strong>Dec 2024 – Feb 2025 · School science exhibition</strong></p>

        <h2>The problem</h2>
        <p>Chemistry education in school is almost entirely symbolic: equations on a board, molecular diagrams in a textbook. The reactions happen in a flask during a lab session, and then they're over. There's no way to interact with the process, slow it down, reverse it, or ask &quot;what happens if I change this variable.&quot;</p>
        <p>I wanted to build something you could actually touch and control.</p>

        <h2>What it does</h2>
        <p>ChemX is a physical simulator where chemical reactions happen in hardware. LEDs represent atomic bonds forming and breaking. An electromagnet simulates molecular attraction and repulsion. A web interface lets you select a reaction, adjust variables, and watch it play out on the physical rig in real time. Actual hardware responding, not a simulation on a screen.</p>
        <p>It was my first hardware project. I didn't have a framework for thinking about constraint-based building at the time, but this is where I learned it: components don't work the way documentation says they do, and the interesting problems are always at the boundary between the physical and the digital.</p>

        <h2>How it works</h2>
        <ul>
          <li><strong>Hardware rig:</strong> Arduino Uno driving a custom PCB with LED arrays and an electromagnet module. Each reaction is encoded as a timed sequence of hardware events.</li>
          <li><strong>Web interface:</strong> Browser-based control panel served from the Arduino. Select reaction type, trigger it, watch the rig respond in real time.</li>
          <li><strong>Reactions:</strong> Acid-base neutralisation, oxidation-reduction, and precipitation reactions, each with distinct LED patterns and electromagnet states.</li>
          <li><strong>Constraint design:</strong> The Arduino's 2KB of RAM meant every byte mattered. Taught me to optimise before I knew what optimisation was.</li>
        </ul>

        <h2>Impact</h2>
        <ul>
          <li>1st — Hardware project ever built</li>
          <li>✓ — School science exhibition</li>
          <li>2mo — Built in two months alongside school</li>
          <li>→ — Led directly to the LiFi network project</li>
        </ul>
