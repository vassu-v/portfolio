<body>
  <a class="skip" href="#cmd">skip to the command line</a>
  <div class="window" id="window">
    <header class="titlebar">
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="title">shorya@kolkata <span class="title__path" id="title-path">~</span></span>
      <nav class="titlebar__actions" aria-label="site">
        <button type="button" class="tb-btn" data-cmd="theme">theme</button>
        <a class="tb-btn" href="/">3D room ↗</a>
      </nav>
    </header>
    <main id="log" class="log" role="log" aria-live="polite" aria-label="terminal output"></main>
    <form class="promptbar" id="promptbar" autocomplete="off">
      <label class="prompt" for="cmd" id="prompt"><span class="p-user">visitor</span><span class="p-at">@</span><span class="p-host">shorya</span> <span class="p-path">~</span> <span class="p-arrow">❯</span></label>
      <div class="field">
        <div class="ghost" aria-hidden="true"><span class="ghost__typed"></span><span class="ghost__rest"></span></div>
        <input id="cmd" name="cmd" type="text" spellcheck="false" autocapitalize="none" autocorrect="off" enterkeyhint="go" aria-describedby="hintline" />
      </div>
    </form>
    <p class="hintline" id="hintline">type a command, or tap one below · <kbd>Tab</kbd> completes</p>
    <nav class="chips" id="chips" aria-label="quick commands"></nav>
  </div>

  <noscript>
    <p style="padding:24px;font-family:monospace;color:#eee">This terminal needs JavaScript. The plain site is at <a href="/?classic" style="color:#D4983A">/?classic</a>.</p>
  </noscript>

  <script src="./terminal-ui.js"></script>
  <script>TerminalUI.mount(document.getElementById("window"));</script>
